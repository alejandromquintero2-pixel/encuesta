<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuesta</title>

  <!-- Conecta el CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

</head>
<body>
<div class="card">
  <h1>Encuesta sobre menki :D</h1>

  <!-- CAMBIA TU_CORREO@gmail.com POR TU CORREO -->
  <form action="https://formsubmit.co/alejandromquintero2@gmail.com" method="POST">

    <!-- Configuración de FormSubmit -->
    <input type="hidden" name="_subject" value="Nueva respuesta de la encuesta">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <input type="text" name="_honey" style="display:none"> <!-- anti-spam -->

    <label class="q" for="nombre">Quien hara la encuesta? (pueden ser los 2)</label>
    <input type="text" id="nombre" name="Nombre" required>

    <label class="q">Cual es mi materia favorita?</label>
    <label class="op"><input type="radio" name="Calificacion" value="Educacion fisica" required> Educacion fisica</label>
    <label class="op"><input type="radio" name="Calificacion" value="Ingles"> Ingles</label>
    <label class="op"><input type="radio" name="Calificacion" value="Matematicas"> Matematicas</label>
    <label class="op"><input type="radio" name="Calificacion" value="Quimica"> Quimica</label>

    <label class="q">Cual es mi materia favorita?</label>
    <label class="op"><input type="radio" name="Calificacion" value="Azul" required> Azul</label>
    <label class="op"><input type="radio" name="Calificacion" value="Verde"> Verde</label>
    <label class="op"><input type="radio" name="Calificacion" value="Rojo"> Rojo</label>
    <label class="op"><input type="radio" name="Calificacion" value="Negro"> Negro</label>


    <label class="q" for="nivel">¿Del 1 al 100, qué tanto creen que me conocen?</label>
    <input type="range" id="nivel" name="Puntuacion" min="1" max="100" value="50"
      oninput="document.getElementById('valor').textContent = this.value">
    <p>Que tanto: <strong id="valor">50</strong></p>

    <label class="q">¿Cual es mi color favorito?</label>
    <label class="op"><input type="checkbox" name="Gusto" value="Rojo"> Rojo</label>
    <label class="op"><input type="checkbox" name="Gusto" value="Verde"> Verde</label>
    <label class="op"><input type="checkbox" name="Gusto" value="Azul"> Azul</label>
    <label class="op"><input type="checkbox" name="Gusto" value="Negro"> Negro</label>

    <label class="q" for="frecuencia">¿Cual carrera quiero estudiar?</label>
    <select id="frecuencia" name="Frecuencia">
      <option>Diseño grafico</option>
      <option>Contarudiria</option>
      <option>Ingenieria en sistemas</option>
      <option>Ingenieria civil</option>
    </select>

    <label class="q" for="comentarios">Comentarios??</label>
    <textarea id="comentarios" name="Comentarios" rows="4"></textarea>

    <label class="q">Paguina hecha por mi jeje (vere que tan bien estan sus resultados)</label>

    <button type="submit">Enviar</button>
  </form>
</div>
</body>
</html>
